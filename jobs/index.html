<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>JobHunt</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; color: #202124; background: #f8f9fa; }
    main { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .login { max-width: 360px; margin: 12vh auto; background: #fff; border: 1px solid #dadce0; border-radius: 8px; padding: 24px; }
    input, select { padding: 8px 10px; border: 1px solid #bdc1c6; border-radius: 6px; font: inherit; box-sizing: border-box; }
    .login input { width: 100%; margin-top: 10px; }
    button { cursor: pointer; border-radius: 6px; border: 1px solid #dadce0; background: #fff; padding: 6px 10px; font: inherit; }
    button.primary { background: #1a73e8; color: #fff; border: 0; width: 100%; margin-top: 14px; padding: 10px; font-weight: 700; }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 16px 0; }
    table { border-collapse: collapse; width: 100%; background: #fff; }
    th, td { border: 1px solid #dadce0; padding: 8px; vertical-align: top; text-align: left; font-size: 14px; }
    th { background: #f1f3f4; cursor: pointer; user-select: none; }
    .muted { color: #5f6368; font-size: 12px; }
    .react { font-size: 18px; line-height: 1; padding: 2px 6px; }
    .react.active { background: #e8f0fe; border-color: #1a73e8; }
    .note { width: 100%; min-width: 160px; }
    .err { color: #b3261e; min-height: 18px; }
    .row-applied { background: #e6f4ea; }
    .row-hidden { opacity: 0.45; }
  </style>
</head>
<body>
<main x-data="jobsApp()" x-init="init()">
  <template x-if="!session">
    <div class="login">
      <h1>JobHunt</h1>
      <form @submit.prevent="login()">
        <input type="email" placeholder="email" x-model="email" autocomplete="username">
        <input type="password" placeholder="password" x-model="password" autocomplete="current-password">
        <button class="primary" type="submit">Log in</button>
      </form>
      <p class="err" x-text="error"></p>
    </div>
  </template>

  <template x-if="session">
    <div>
      <div class="controls">
        <input type="search" placeholder="search title / company" x-model="search">
        <select x-model="categoryFilter">
          <option value="">all categories</option>
          <option value="reviewable">reviewable</option>
          <option value="location_review">remote review</option>
          <option value="near_miss">near miss</option>
        </select>
        <select x-model="statusFilter">
          <option value="">all statuses</option>
          <option value="none">no status</option>
          <option value="interested">interested</option>
          <option value="applied">applied</option>
          <option value="needs_cv">needs_cv</option>
          <option value="review">review</option>
          <option value="not_fit">not_fit</option>
          <option value="false_positive">false_positive</option>
          <option value="hidden">hidden</option>
        </select>
        <label><input type="checkbox" x-model="hideHidden"> hide hidden</label>
        <span class="muted" x-text="visibleJobs().length + ' / ' + jobs.length + ' jobs'"></span>
        <button @click="logout()">log out</button>
      </div>
      <p class="err" x-text="error"></p>

      <table>
        <thead>
          <tr>
            <th @click="sortBy('company')">Company</th>
            <th @click="sortBy('title')">Role</th>
            <th @click="sortBy('category')">Category</th>
            <th @click="sortBy('score')">Score</th>
            <th>React</th>
            <th>Status</th>
            <th>Note</th>
            <th>Link</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="job in visibleJobs()" :key="job.job_key">
            <tr :class="rowClass(job)">
              <td x-text="job.company"></td>
              <td>
                <span x-text="job.title"></span>
                <div class="muted" x-text="job.location"></div>
              </td>
              <td x-text="job.category"></td>
              <td x-text="job.final_score ?? job.closeness_score ?? ''"></td>
              <td style="white-space:nowrap">
                <button class="react" :class="{active: statusOf(job) === 'interested'}" title="superlike → interested" @click="setStatus(job, 'interested')">⭐</button>
                <button class="react" :class="{active: statusOf(job) === 'hidden'}" title="hide" @click="setStatus(job, 'hidden')">👎</button>
              </td>
              <td>
                <select :value="statusOf(job)" @change="setStatus(job, $event.target.value)">
                  <option value="">—</option>
                  <option value="interested">interested</option>
                  <option value="applied">applied</option>
                  <option value="needs_cv">needs_cv</option>
                  <option value="review">review</option>
                  <option value="not_fit">not_fit</option>
                  <option value="false_positive">false_positive</option>
                  <option value="hidden">hidden</option>
                </select>
              </td>
              <td>
                <input class="note" type="text" :value="noteOf(job)"
                       @input.debounce.600ms="setNote(job, $event.target.value)" placeholder="note…">
              </td>
              <td><template x-if="job.url"><a :href="job.url" target="_blank" rel="noopener">open</a></template></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </template>
</main>

<script>
const SUPABASE_URL = "https://fncnxlqbhsoinknkgvvb.supabase.co";
// Publishable key is safe to ship publicly: RLS denies the anon/unauthenticated role all access.
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_QOhba22uPbwlfYqGxRKS5Q_kmfsvO49";

function jobsApp() {
  // Keep the Supabase client in closure scope, NOT in Alpine's reactive data:
  // Alpine would deep-proxy the client's circular internals and overflow the stack.
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  return {
    session: null, email: "", password: "", error: "",
    jobs: [], feedback: {},
    search: "", categoryFilter: "", statusFilter: "", hideHidden: true,
    sortKey: "score", sortDir: -1,

    async init() {
      const { data } = await client.auth.getSession();
      this.session = data.session;
      client.auth.onAuthStateChange((_e, s) => { this.session = s; if (s) this.loadData(); });
      if (this.session) this.loadData();
    },
    async login() {
      this.error = "";
      const { error } = await client.auth.signInWithPassword({ email: this.email, password: this.password });
      if (error) this.error = error.message;
    },
    async logout() { await client.auth.signOut(); this.jobs = []; this.feedback = {}; },

    async loadData() {
      this.error = "";
      const [jobsRes, fbRes] = await Promise.all([
        client.from("jobs").select("*"),
        client.from("feedback").select("job_key,status,note"),
      ]);
      if (jobsRes.error) { this.error = jobsRes.error.message; return; }
      if (fbRes.error) { this.error = fbRes.error.message; return; }
      this.jobs = jobsRes.data || [];
      const map = {};
      (fbRes.data || []).forEach(r => map[r.job_key] = { status: r.status, note: r.note || "" });
      this.feedback = map;
    },

    statusOf(job) { return (this.feedback[job.job_key] || {}).status || ""; },
    noteOf(job) { return (this.feedback[job.job_key] || {}).note || ""; },

    async upsertFeedback(job_key, status, note) {
      // Clearing both status and note removes the row rather than storing an empty one.
      if (!status && !note) {
        delete this.feedback[job_key];
        const { error } = await client.from("feedback").delete().eq("job_key", job_key);
        if (error) this.error = error.message;
        return;
      }
      const row = { job_key, status, note, updated_at: new Date().toISOString() };
      this.feedback[job_key] = { status, note };
      const { error } = await client.from("feedback").upsert(row);
      if (error) this.error = error.message;
    },
    setStatus(job, status) { this.upsertFeedback(job.job_key, status, this.noteOf(job)); },
    setNote(job, note) { this.upsertFeedback(job.job_key, this.statusOf(job), note); },

    sortBy(key) { if (this.sortKey === key) this.sortDir *= -1; else { this.sortKey = key; this.sortDir = key === "score" ? -1 : 1; } },

    visibleJobs() {
      const q = this.search.trim().toLowerCase();
      let rows = this.jobs.filter(j => {
        const status = this.statusOf(j);
        if (this.hideHidden && (status === "hidden" || status === "not_fit" || status === "false_positive")) return false;
        if (this.categoryFilter && j.category !== this.categoryFilter) return false;
        if (this.statusFilter === "none" && status) return false;
        if (this.statusFilter && this.statusFilter !== "none" && status !== this.statusFilter) return false;
        if (q && !((j.title || "").toLowerCase().includes(q) || (j.company || "").toLowerCase().includes(q))) return false;
        return true;
      });
      const key = this.sortKey, dir = this.sortDir;
      const val = (j) => key === "score" ? (j.final_score ?? j.closeness_score ?? -1) : (j[key] || "");
      return rows.sort((a, b) => { const x = val(a), y = val(b); return x < y ? -dir : x > y ? dir : 0; });
    },

    rowClass(job) {
      const s = this.statusOf(job);
      if (s === "applied") return "row-applied";
      if (s === "hidden" || s === "not_fit" || s === "false_positive") return "row-hidden";
      return "";
    },
  };
}
</script>
</body>
</html>
