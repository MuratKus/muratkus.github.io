OVnFvuPWvk989rmpwh2hZ2ZB0q0++xVKfT6rtZsNW+WpaD6G0P+SemgqdQ63NDZiyeaL6iyCZeoYl4ArgSi",

    function b64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index++) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function decrypt(password) {
      const encoder = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        encoder.encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      const key = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: b64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64ToBytes(payload.iv) },
        key,
        b64ToBytes(payload.ciphertext)
      );
      return new TextDecoder().decode(plaintext);
    }

    document.getElementById("unlock-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const error = document.getElementById("error");
      error.textContent = "";
      try {
        const html = await decrypt(document.getElementById("password").value);
        document.open();
        document.write(html);
        document.close();
      } catch {
        error.textContent = "Could not unlock dashboard. Check the password and try again.";
      }
    });
